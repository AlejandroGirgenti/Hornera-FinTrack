services:
  db:
    image: postgres:16-alpine
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fintrack
    ports:
      - '5432:5432'
    volumes:
      - fintrack-data:/var/lib/postgresql/data
      # Crea también la base fintrack_test la primera vez que arranca el contenedor
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fintrack']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fintrack-data:
